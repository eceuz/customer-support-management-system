version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: destek_postgres

    environment:
      POSTGRES_DB: destek_sistemi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: